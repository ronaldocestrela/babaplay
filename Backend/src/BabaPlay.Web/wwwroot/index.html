<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Baba Play - Plataforma para Associações Esportivas" />
    <meta property="og:image" content="babaplayOG.png" />
    <meta property="og:type" content="website" />
    <title>Baba Play</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!--
        TODO(design-system): CDN é um atalho temporário para destravar o app, que hoje
        usa classes Bootstrap (grid, botões, badges, ícones "bi bi-*") e classes Tailwind
        (páginas de auth/onboarding) sem nenhum dos dois frameworks carregado.
        Próximo passo recomendado: consolidar em um único framework com build próprio
        (npm/Tailwind CLI ou pacote Bootstrap) em vez de depender de CDN em produção.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // preflight/container desligados para não conflitar com o reset do Bootstrap
        // e com a classe ".container" (Bootstrap) já usada em algumas páginas.
        tailwind.config = {
            corePlugins: { preflight: false, container: false },
        };
    </script>

    <!-- app.css por último para que os tokens/overrides do BabaPlay tenham prioridade sobre o Bootstrap -->
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; font-family: sans-serif;">
            <div style="text-align: center;">
                <img src="babaplayOG.png" alt="Baba Play Logo" style="max-width: 220px; width: 100%; height: auto; margin-bottom: 1.25rem;" />
                <div class="loading-spinner"></div>
                <p style="margin-top: 1rem; color: #94a3b8;">Carregando Baba Play...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="background: #ef4444; color: white; padding: 1rem; display: none; position: fixed; bottom: 0; width: 100%;">
        Ocorreu um erro não tratado na aplicação.
        <a href="" class="reload" style="color: white; font-weight: bold; margin-left: 1rem;">Recarregar</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
