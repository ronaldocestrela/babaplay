<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baba Play</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; font-family: sans-serif;">
            <div style="text-align: center;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 1rem; color: #94a3b8;">Carregando Baba Play...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="background: #ef4444; color: white; padding: 1rem; display: none; position: fixed; bottom: 0; width: 100%;">
        Ocorreu um erro não tratado na aplicação.
        <a href="" class="reload" style="color: white; font-weight: bold; margin-left: 1rem;">Recarregar</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
